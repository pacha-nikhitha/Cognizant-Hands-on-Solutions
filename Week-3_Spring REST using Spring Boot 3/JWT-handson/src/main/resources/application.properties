# ============================================================
# Spring Boot Application Properties - JWT Authentication Service
# ============================================================

# Server port - matches the curl command: http://localhost:8090/authenticate
server.port=8090

# Application name (used in logs and Spring Actuator if added later)
spring.application.name=jwt-handson

# ============================================================
# Logging Configuration
# ============================================================

# Root log level
logging.level.root=INFO

# Show detailed logs for our own classes (helpful during development)
logging.level.com.cognizant.springlearn=DEBUG

# Show Spring Security authentication events
logging.level.org.springframework.security=DEBUG

# Log format: timestamp + level + logger name + message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n
