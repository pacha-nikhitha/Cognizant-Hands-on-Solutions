# Server port
server.port=8085

# Application name (shows in Actuator / logs)
spring.application.name=spring-learn

# -----------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------

# Root log level
logging.level.root=INFO

# Enable DEBUG for our own package so @Info + @Debug logs are visible
logging.level.com.cognizant.springlearn=DEBUG

# Log pattern (optional – gives timestamps and thread names in console)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
